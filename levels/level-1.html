<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SQL Valhalla – Level 1</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-level-id="1">
    <header class="page-header">
      <a class="back-link" href="../index.html">&larr; Zurück zur Übersicht</a>
      <h1>SQL Valhalla</h1>
      <p>Baue deine Query in der richtigen Reihenfolge.</p>
    </header>

    <main>
      <section class="panel" id="play-area">
        <div class="story">
          <h2 id="level-title"></h2>
          <p id="level-story"></p>
        </div>
        <div class="task">
          <h3>Aufgabe</h3>
          <p id="level-task"></p>
        </div>
        <div class="builder">
          <h3>SQL schmieden</h3>
          <div class="fragments" id="fragment-pool"></div>
          <div class="forge">
            <p>Deine Reihenfolge</p>
            <div class="sequence" id="sequence"></div>
          </div>
        </div>
        <div class="actions">
          <button class="secondary" id="reset">Zurücksetzen</button>
          <button class="primary" id="check">Prüfen</button>
        </div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
      </section>
    </main>

    <footer class="footer">
      <p>SQL Valhalla &mdash; Schmiede deine Datenbank-Legende.</p>
    </footer>

    <script src="../script.js"></script>
  </body>
</html>
